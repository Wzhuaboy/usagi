<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usagi</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #faf7f2; color: #333; min-height: 100vh; }
.wrap { max-width: 720px; margin: 0 auto; padding: 64px 20px 40px; }
header { text-align: center; margin-bottom: 40px; }
.logo { width: 72px; height: 72px; border-radius: 50%; background: #f59e0b; color: #fff; font-size: 36px; line-height: 72px; margin: 0 auto 16px; }
h1 { font-size: 32px; letter-spacing: 2px; }
.sub { margin-top: 8px; color: #888; font-size: 15px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
.card { display: block; background: #fff; border: 1px solid #eee; border-radius: 14px; padding: 18px 20px; text-decoration: none; color: #333; }
.card:hover { border-color: #f59e0b; }
.card h2 { font-size: 17px; margin-bottom: 6px; }
.card p { font-size: 13px; color: #888; line-height: 1.6; }
.card span { display: block; margin-top: 10px; font-size: 12px; color: #bbb; word-break: break-all; }
footer { text-align: center; margin-top: 40px; color: #bbb; font-size: 13px; }
footer a { color: #bbb; }
.loading { text-align: center; color: #bbb; font-size: 14px; padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="logo">U</div>
<h1 id="site-title">Usagi</h1>
<p class="sub" id="site-subtitle">Wzhuaboy 的个人小站</p>
</header>
<div class="grid" id="links"><p class="loading">加载中……</p></div>
<footer>
<p>usagi.loc.cc · <a href="https://github.com/Wzhuaboy" target="_blank" rel="noopener">GitHub @Wzhuaboy</a> · <a href="admin/">管理后台</a></p>
</footer>
</div>
<script>
fetch("data/links.json")
  .then(function (r) { if (!r.ok) throw new Error("load failed"); return r.json(); })
  .then(function (data) {
    document.getElementById("site-title").textContent = data.title || "Usagi";
    document.getElementById("site-subtitle").textContent = data.subtitle || "";
    var box = document.getElementById("links");
    box.innerHTML = "";
    (data.links || []).forEach(function (link) {
      var host = "";
      try { host = new URL(link.url).host + new URL(link.url).pathname; } catch (e) { host = link.url; }
      var a = document.createElement("a");
      a.className = "card";
      a.href = link.url;
      a.target = "_blank";
      a.rel = "noopener";
      var h2 = document.createElement("h2");
      h2.textContent = link.title;
      var p = document.createElement("p");
      p.textContent = link.description || "";
      var span = document.createElement("span");
      span.textContent = host;
      a.appendChild(h2);
      a.appendChild(p);
      a.appendChild(span);
      box.appendChild(a);
    });
  })
  .catch(function () {
    document.getElementById("links").innerHTML = '<p class="loading">链接加载失败，请刷新再试。</p>';
  });
</script>
</body>
</html>
